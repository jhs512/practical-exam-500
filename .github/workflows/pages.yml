name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (state model)
        run: node --test tests/domain.test.mjs
      - name: Verify the published SQL questions
        run: python3 tests/check_published_sql.py
      - name: Check data bundle
        run: |
          node -e "const i=require('./site/data/index.json'); if(i.total!==500||i.items.length!==500) {console.error('bad total', i.total); process.exit(1)} console.log('questions', i.total)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
